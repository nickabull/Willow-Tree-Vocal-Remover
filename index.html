<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>Willow Tree Vocal Remover</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="brand">WILLOW TREE <span>DANCE &amp; THEATRE ARTS</span></div><h1>VOCAL<br>REMOVER</h1><p class="tag">Separate the voice from the music.</p></header>
<section class="card"><label for="url">Paste a YouTube link</label><div class="row"><input id="url" type="url" placeholder="https://youtube.com/watch?v=…" autocomplete="off"><button id="extract">EXTRACT VOCALS</button></div><div class="or"><span>OR</span></div><label class="upload">UPLOAD AUDIO<input id="file" type="file" accept="audio/*"></label><p class="hint">MP3, WAV, M4A and other common audio files</p></section>
<section id="status" class="status hidden"><div class="spinner"></div><strong>Getting things ready…</strong><p id="statusText">Preparing your track.</p></section>
<section id="results" class="results hidden"><article><h2>ORIGINAL</h2><audio id="original" controls></audio><a id="downloadOriginal" class="download">DOWNLOAD</a></article><article><h2>VOCALS</h2><audio id="vocals" controls></audio><a id="downloadVocals" class="download">DOWNLOAD</a></article><article><h2>INSTRUMENTAL</h2><audio id="instrumental" controls></audio><a id="downloadInstrumental" class="download">DOWNLOAD</a></article></section>
<footer>Willow Tree Dance &amp; Theatre Arts</footer></main><script src="app.js"></script></body></html>
